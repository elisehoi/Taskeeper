<head>
  <title>Taskeeper Login</title>    
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="icon" href="images/favicon.ico">
</head>
<div class="container">
  <form action="" class="form" id="id">
      <img class="appname" src="../../../assets/images/logo.png"><h1 class="form__title">Login</h1>
      <div class="form__message form__message--error"></div>
      <div class="form__imput-group">
          <input type="text" class="form__input" placeholder="Username" [(ngModel)]= "credentials.userName" name="userName">
          <div class="form__input-error-message"></div>
      </div>
      <div class="form__imput-group">
          <input type="password" class="form__input" placeholder="Password" [(ngModel)]= "credentials.password" name="password">
          <div class="form__input-error-message"></div>
      </div>
      <form (ngSubmit)="onLoginSubmit()">
        <div role="alert" *ngIf="formError" class="form__message--error">
          {{ formError }}
        </div>
      <button class="form__button" type="submit">Continue</button>
      <p class="form__text">
          <a href="#" class="form__link">Forgot your password?</a> <!-- TO DO: link with password reset page-->
      </p>
      <p class="form__text">
          <a class="form__link" href="./create-account" id="linkCreateAccount">Don't have an account? Create an account</a>
      </p>
  </form>
<!--</div>-->
