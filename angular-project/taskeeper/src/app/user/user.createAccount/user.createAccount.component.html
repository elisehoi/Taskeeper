    <html> -->
        <head>
            <title>Taskeeper Account Creation</title>    
            <meta charset="utf-8">
            <link rel="stylesheet" href="../../../styles.css">
            <link rel="icon" href="images/favicon.ico">
        </head>
        <body>
            <div class="container">
                <form action="" class="form" id="createAccount">
                   <h1 class="form__title"> <img class="appname" src="../../../assets/images/logo.png">Create Account</h1>
                    <div class="form__message form__message--error"></div>
                    <div class="form__imput-group">
                        <input type="text" class="form__input" placeholder="First Names" [(ngModel)]="credentials.firstName" name="firstName">
                        <div class="form__input-error-message"></div>
                    </div>
                    <div class="form__imput-group">
                        <input type="text" class="form__input" placeholder="Last Name" [(ngModel)]="credentials.lastName" name="lastName">
                        <div class="form__input-error-message"></div>
                    </div>
                    <div class="form__imput-group">
                        <input type="text" class="form__input" placeholder="Username" [(ngModel)]="credentials.userName" name="userName">
                        <div class="form__input-error-message"></div>
                    </div>
                    <div class="form__imput-group">
                        <input type="text" class="form__input" placeholder="Email Adress" [(ngModel)]="credentials.email" name="email">
                        <div class="form__input-error-message"></div>
                    </div>
                    <div class="form__imput-group">
                        <input type="password" class="form__input" placeholder="Password (min. 12 characters, numbers and letters)" [(ngModel)]="credentials.password" name="password">
                        <div class="form__input-error-message"></div>
                    </div>
                    <div class="form__imput-group">
                        <input type="password" class="form__input" placeholder="Confirm password" [(ngModel)]="credentials.confirmPassword" name="confirmPassword">
                        <div class="form__input-error-message"></div>
                    </div>

                    <!-- Error field -->
                    <form (submit)="onSignupSubmit()" #signupForm="ngForm">
                        <div role="alert" *ngIf="formError" class="form__message--error ">
                        {{ formError }}</div>
                    

                    <button class="form__button" type="submit" [disabled]="!signupForm.form.valid">Continue</button>
                    <p class="form__text">
                        <!-- TO DO: DISPLAY THE CGU WHEN CLICKING THIS BUTTON-->
                        <a class="form__link" href="./login" id="linkLogin">Already have an account? Sign in here</a>
                    </p>
                </form>

        </body>
    </html>-->
