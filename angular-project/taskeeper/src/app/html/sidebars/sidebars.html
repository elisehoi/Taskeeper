<div class="top-bar">
  <button class="menubutton"onclick="toggleUserbar()"></button>
  <button class="projectbutton"onclick="toggleProjectbar()"></button>
</div>
<!-- Opens the userbar whn clicking on the button-->
<script type="text/javascript"> 
  function toggleUserbar() {
    const userbar = document.getElementById("userbar");
    userbar.classList.toggle("hide");
  } 
  function toggleProjectbar() {
    const projectbar = document.getElementById("projectbar");
    projectbar.classList.toggle("hide");
  } 
</script>
