<!DOCTYPE html>
    <html>
        <head>
            <title>Taskeeper Login</title>    
            <meta charset="utf-8">
            <link rel="stylesheet" href="../styles/login.css">
            <link rel="icon" href="images/favicon.ico">
        </head>
        <body>
            <div class="container">
                <form action="" class="form form--hidden" id="id">
                    <img class="form__title" src="../../../assets/images/logo.png"><h1 class="form__title">Login</h1>
                    <div class="form__message form__message--error"></div>
                    <div class="form__imput-group">
                        <input type="text" class="form__input" autofocus placeholder="Username or email">
                        <div class="form__input-error-message"></div>
                    </div>
                    <div class="form__imput-group">
                        <input type="password" class="form__input" autofocus placeholder="Password">
                        <div class="form__input-error-message"></div>
                    </div>
                    <button class="form__button" type="submit">Continue</button>
                    <p class="form__text">
                        <a href="#" class="form__link">Forgot your password?</a>
                    </p>
                    <p class="form__text">
                        <a class="form__link" href="./" id="linkCreateAccount">Don't have an account? Create an account</a>
                    </p>
                </form>
                <form action="" class="form" id="createAccount">
                   <h1 class="form__title"> <img class="appname" src="../../../assets/images/logo.png">Create Account</h1>
                    <div class="form__message form__message--error"></div>
                    <div class="form__imput-group">
                        <input type="text" class="form__input" autofocus placeholder="First Names">
                        <div class="form__input-error-message"></div>
                    </div>
                    <div class="form__imput-group">
                        <input type="text" class="form__input" autofocus placeholder="Last Name">
                        <div class="form__input-error-message"></div>
                    </div>
                    <div class="form__imput-group">
                        <input type="text" class="form__input" autofocus placeholder="Username">
                        <div class="form__input-error-message"></div>
                    </div>
                    <div class="form__imput-group">
                        <input type="text" class="form__input" autofocus placeholder="Email Adress">
                        <div class="form__input-error-message"></div>
                    </div>
                    <div class="form__imput-group">
                        <input type="password" class="form__input" autofocus placeholder="Password (min. 12 characters, numbers and letters)">
                        <div class="form__input-error-message"></div>
                    </div>
                    <div class="form__imput-group">
                        <input type="password" class="form__input" autofocus placeholder="Confirm password">
                        <div class="form__input-error-message"></div>
                    </div>

                    <button class="form__button" type="submit">Continue</button>
                    <p class="form__text">
                        <a class="form__link" href="./" id="linkLogin">Already have an account? Sign in here</a>
                    </p>
                </form>
            </div>
        </body>
    </html>
